
services:
  # ------------------------------------------
  # mysql
  # ------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mem-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-error}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-error}
      MYSQL_USER: ${MYSQL_USER:-error}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-error}
    volumes:
      - "C:/mysql-data/${ENVIRONMENT}:/var/lib/mysql"
      - ./mysql-init:/docker-entrypoint-initdb.d # 👈 Mounts your init scripts
    networks:
      - environment-specific-network
    restart: always

  # ------------------------------------------
  # mysql-prod-test (large prod dump, tuned for performance)
  # ------------------------------------------
  mysql-prod-test:
    image: mysql:8.0
    container_name: mem-mysql-prod-test
    profiles:
      - prod-test
    ports:
      - "${MYSQL_PROD_TEST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-error}
      MYSQL_DATABASE: ${MYSQL_PROD_TEST_DATABASE:-memowikis_prod}
      MYSQL_USER: ${MYSQL_USER:-error}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-error}
    command: >
      --innodb-buffer-pool-size=4G
      --innodb-buffer-pool-instances=4
      --innodb-log-file-size=1G
      --innodb-log-buffer-size=256M
      --innodb-flush-log-at-trx-commit=0
      --innodb-flush-method=O_DIRECT
      --innodb-doublewrite=OFF
      --innodb-adaptive-hash-index=OFF
      --innodb-autoinc-lock-mode=2
      --innodb-change-buffering=none
      --innodb-write-io-threads=16
      --innodb-read-io-threads=16
      --innodb-page-cleaners=4
      --innodb-stats-on-metadata=OFF
      --skip-log-bin
      --performance-schema=OFF
      --max-allowed-packet=256M
      --innodb-io-capacity=2000
      --innodb-io-capacity-max=4000
      --sort-buffer-size=4M
      --bulk-insert-buffer-size=256M
      --tmp-table-size=256M
      --max-heap-table-size=256M
    volumes:
      - "C:/mysql-data/prod-test:/var/lib/mysql"
      - "${MYSQL_IMPORT_DIR:-C:/Files}:/import:ro"
    deploy:
      resources:
        limits:
          memory: 6G
    networks:
      - environment-specific-network
    restart: always

  # ------------------------------------------
  # Meilisearch
  # ------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v0.30
    container_name: mem-meilisearch
    command: ["meilisearch", "--master-key=${MEILI_MASTER_KEY}"]
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - "C:/Meilisearch/${ENVIRONMENT}:/meili_data"
    networks:
      - environment-specific-network
    restart: always

  # ------------------------------------------
  # Redis
  # ------------------------------------------
  redis:
    image: redis:7.2.4
    container_name: mem-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - "C:/redis-data/${ENVIRONMENT}:/data"
    networks:
      - environment-specific-network
    restart: always

  # ------------------------------------------
  # Hocuspocus
  # ------------------------------------------
  hocuspocus:
    build:
      context: ../../hocuspocus
      dockerfile: Dockerfile_local
    container_name: mem-hocuspocus
    ports:
      - "${HOCUSPOCUS_PORT:-3010}:3010"
    environment:
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://host.docker.internal:7000}
      - HOCUSPOCUS_SECRET_KEY=${HOCUSPOCUS_SECRET_KEY:-error}
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENVIRONMENT=${ENVIRONMENT:-stage}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - environment-specific-network
    restart: always

# ------------------------------------------
# Shared network (external, if you already created it manually)
# ------------------------------------------
networks:
  environment-specific-network:
    name: mem-${MEM_ENVIRONMENT:-stage}
    driver: bridge
